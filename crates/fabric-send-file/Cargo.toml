[package]
name = "fabric-send-file"
version = "0.2.15"
edition = "2024"
description = "fabric send-file: hand one file to a peer's per-peer inbox"
repository = "https://github.com/compoundingtech/fabric"

[dependencies]
fabric-service-api = { path = "../fabric-service-api" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "fs"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full"] }
