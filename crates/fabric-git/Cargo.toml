[package]
name = "fabric-git"
version = "0.2.15"
edition = "2024"
description = "Git's smart protocol between fabric peers, and the git-remote-fabric helper"
repository = "https://github.com/compoundingtech/fabric"

[dependencies]
fabric-service-api = { path = "../fabric-service-api" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "io-std", "process", "sync", "time", "rt", "macros"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full"] }
