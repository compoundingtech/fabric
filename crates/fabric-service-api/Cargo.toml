[package]
name = "fabric-service-api"
version = "0.2.38"
edition = "2024"
description = "What a fabric service needs from the base network: an authenticated stream from one peer for one service"
repository = "https://github.com/compoundingtech/fabric"

[dependencies]
anyhow = "1"
tokio = { version = "1", features = ["io-util", "process", "rt", "time"] }
tokio-util = "0.7"

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "time"] }
