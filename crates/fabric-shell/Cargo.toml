[package]
name = "fabric-shell"
version = "0.2.15"
edition = "2024"
description = "fabric shell: a PTY on a peer, and the local terminal that drives it"
repository = "https://github.com/compoundingtech/fabric"

[dependencies]
fabric-service-api = { path = "../fabric-service-api" }
anyhow = "1"
crossterm = "0.29.0"
libc = "0.2"
portable-pty = "0.9.0"
tokio = { version = "1", features = ["io-util", "io-std", "net", "rt", "macros", "signal", "sync", "time"] }
tokio-util = "0.7"
