[package]
name = "fabric-config"
version = "0.2.18"
edition = "2024"
description = "The files and local contracts the fabric daemon and its sync companion share"
repository = "https://github.com/compoundingtech/fabric"

[dependencies]
anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "net", "time", "sync", "rt", "macros"] }
toml = "0.9"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full"] }
